name: CI

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  workflow_call:
    inputs:
      upload:
        description: "Build output to upload as an artifact for a deploy workflow"
        type: boolean
        default: false

jobs:
  build:
    name: Code standards & build
    runs-on: ubuntu-latest
    timeout-minutes: 3

    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: "📦 Install dependencies"
        run: npm ci

      - name: "🔎 Lint code"
        run: npm run lint

      - name: "📝 Checking code format"
        run: npm run format:check

      - name: "🚀 Build the project"
        run: npm run build

      # Only when called with `upload: true`, so that pull requests are unaffected
      - name: "📦 Upload build output"
        if: inputs.upload
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          # Upload everything that was built, including dotfiles
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
