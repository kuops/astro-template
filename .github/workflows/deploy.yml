name: Deploy to Cloudflare Pages

# 把 main 分支的构建产物发布到 Cloudflare Pages（纯静态站，用 pages.dev 域名）。
#
# 需要两个仓库 secrets（Settings → Secrets and variables → Actions → Repository secrets）：
#   CLOUDFLARE_API_TOKEN   权限选 Account → Cloudflare Pages → Edit
#   CLOUDFLARE_ACCOUNT_ID
# 没配的话整个工作流会跳过，所以用这个模板的仓库推 main 时不会报错。
# 可选的仓库变量 CLOUDFLARE_PAGES_PROJECT 可以改 Pages 项目名，默认用仓库名。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  check:
    name: Check Cloudflare credentials
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Job 级的 if 读不到 secrets，所以先在这个小 job 里判断，再把结果传给后面的 job
      - name: "🔍 Check secrets"
        id: check
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，跳过发布"
          fi

  # 复用 CI 的 lint、格式检查和构建，只在最后多上传一份 dist
  build:
    needs: check
    if: needs.check.outputs.configured == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      upload: true

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [check, build]
    if: needs.check.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # wrangler-action 用它在仓库的 Deployments 里记一条发布记录
      deployments: write
    environment:
      name: production
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
    env:
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || github.event.repository.name }}
      PAGES_PRODUCTION_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v7

      - name: "📦 Download build output"
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: "🚀 Deploy to Cloudflare Pages"
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # CI 里 wrangler pages deploy 不会自动建项目，所以第一次先建好；
          # 项目已存在时这条命令会报错，忽略即可
          preCommands: >-
            wrangler pages project create "$PAGES_PROJECT" --production-branch
            "$PAGES_PRODUCTION_BRANCH" || echo "project already exists, continuing"
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
