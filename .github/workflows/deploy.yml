name: Deploy to Cloudflare Workers

# 把 main 分支的构建产物发布到 Cloudflare Workers（纯静态站，由 Workers 托管静态资源）。
# 站点名在 wrangler.jsonc 的 name 里，地址是 <name>.<账户子域>.workers.dev。
#
# 需要两个仓库 secrets（Settings → Secrets and variables → Actions → Repository secrets）：
#   CLOUDFLARE_API_TOKEN   权限用 "Edit Cloudflare Workers" 模板
#   CLOUDFLARE_ACCOUNT_ID
# 没配的话整个工作流会跳过，所以用这个模板的仓库推 main 时不会报错。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  check:
    name: Check Cloudflare credentials
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Job 级的 if 读不到 secrets，所以先在这个小 job 里判断，再把结果传给后面的 job
      - name: "🔍 Check secrets"
        id: check
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，跳过发布"
          fi

  # 复用 CI 的 lint、格式检查和构建，只在最后多上传一份 dist
  build:
    needs: check
    if: needs.check.outputs.configured == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      upload: true

  deploy:
    name: Deploy to Cloudflare Workers
    needs: [check, build]
    if: needs.check.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # wrangler-action 用它在仓库的 Deployments 里记一条发布记录
      deployments: write
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v7

      - name: "📦 Download build output"
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # 配置在 wrangler.jsonc 里。安装 wrangler 会改动 lockfile，
      # 所以声明工作区是"脏"的，免得 wrangler 每次都警告
      - name: "🚀 Deploy to Cloudflare Workers"
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
